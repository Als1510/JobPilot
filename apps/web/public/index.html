<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="JobPilot — decide which opportunities deserve your time." />
  <title>JobPilot — Career Intelligence</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/overview">
        <span class="brand-mark" aria-hidden="true">jp</span>
        <span class="brand-name">JobPilot</span>
        <span class="brand-tag">career intelligence</span>
      </a>
      <nav class="nav" id="nav" aria-label="Primary">
        <a href="#/overview" data-nav="overview">Overview</a>
        <a href="#/discover" data-nav="discover">Discover</a>
        <a href="#/matches" data-nav="matches">Matches</a>
        <a href="#/profile" data-nav="profile">Profile</a>
      </nav>
      <div class="topbar-tools">
        <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle color theme">◐</button>
      </div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1">
    <div class="boot">
      <p class="boot-line">JobPilot</p>
      <p class="boot-sub">Reading your pipeline…</p>
    </div>
  </main>

  <footer class="foot">
    <p>JobPilot M1 — deterministic, explainable job intelligence. Scores never guess; they show their work.</p>
  </footer>

  <!-- Opportunity analysis workspace -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="ws-title">
    <div class="modal-scrim" data-close-modal></div>
    <div class="workspace" role="document">
      <button class="icon-btn ws-close" data-close-modal aria-label="Close">×</button>
      <div id="ws-body"><!-- filled by app.js --></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
